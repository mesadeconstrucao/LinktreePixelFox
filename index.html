<style>
:root{
  --lime:#92cd33; --card:#f4fae8; --chip:#fff; --ink:#161616; --muted:#3a4a28;
  --radius:1.35rem; --shadow:0 10px 24px rgb(30 50 0 / .08);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--lime);color:var(--ink);font-family:"Nunito",ui-sans-serif,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,h2,p{margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

.field{min-height:100dvh;background-color:var(--lime);background-image:radial-gradient(rgb(22 22 22 / .16) 1.15px,transparent 1.25px);background-size:16px 16px}
.wrap{margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;width:100%;max-width:28rem;padding-bottom:3rem}
.hero{position:relative}
.bar{position:absolute;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:1rem 1rem 0}
.round{display:grid;place-items:center;width:44px;height:44px;border-radius:999px}
.round.chip{background:var(--chip);box-shadow:var(--shadow)}
.follow{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 1rem;border-radius:999px;background:var(--chip);box-shadow:var(--shadow);font-size:.875rem;font-weight:800;letter-spacing:.025em}
.follow svg.i{width:16px;height:16px}
.mascot{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-select:none}
.name{position:relative;z-index:10;margin-top:-.5rem;display:flex;flex-direction:column;align-items:center}
.name h1{font-size:3rem;line-height:1;font-weight:800;letter-spacing:-.025em;text-align:center;text-wrap:balance}
.social{margin-top:.75rem;display:flex;align-items:center;gap:1.5rem}
.social a{display:grid;place-items:center;width:44px;height:44px}
.social svg{width:28px;height:28px}

.list{margin-top:1.5rem;display:flex;flex-direction:column;gap:.75rem;padding:0 1rem}
.card{position:relative;display:flex;align-items:center;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow)}
.card .main{display:flex;flex:1;align-items:center;gap:.75rem;min-height:80px;padding:.75rem .5rem .75rem .75rem;border-radius:var(--radius);text-align:left;transition:opacity .15s}
.card .main:active{opacity:.8}
.card .ico{width:56px;height:56px;flex:none;border-radius:1rem;object-fit:cover}
.card .t{font-size:1.125rem;font-weight:700;letter-spacing:-.011em}
.dots{margin-right:.25rem;width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:999px;color:var(--muted)}
.pop{position:absolute;top:3.5rem;right:.75rem;z-index:30;width:11rem;overflow:hidden;border-radius:1rem;background:var(--chip);box-shadow:var(--shadow)}
.pop a,.pop button{display:flex;align-items:center;gap:.5rem;height:44px;width:100%;padding:0 .75rem;font-size:.875rem;font-weight:700;text-align:left}
.pop svg.i{width:16px;height:16px}
.card.donate .ico{display:grid;place-items:center;background:var(--ink);color:var(--lime)}
.card.donate .ico svg.i{width:28px;height:28px;fill:currentColor}

.drawer{position:fixed;inset:0;z-index:40}
.scrim{position:absolute;inset:0;background:rgb(22 22 22 / .35)}
.drawer nav{position:absolute;top:5rem;right:1rem;left:1rem;max-width:26rem;margin:0 auto;border-radius:var(--radius);background:var(--card);padding:.75rem;box-shadow:var(--shadow)}
.drawer .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem;padding:0 .5rem}
.drawer .head p{font-size:1.125rem;font-weight:800}
.drawer nav a{display:flex;align-items:center;gap:.75rem;border-radius:1rem;padding:.5rem;font-weight:700}
.drawer nav a:active{background:rgb(146 205 51 / .4)}
.drawer nav img{width:44px;height:44px;border-radius:.75rem;object-fit:cover}

.toast{position:fixed;bottom:1.5rem;left:50%;z-index:60;transform:translateX(-50%);border-radius:999px;background:var(--ink);padding:.5rem 1rem;font-size:.875rem;font-weight:700;color:var(--chip);box-shadow:var(--shadow);white-space:nowrap}

/* doação */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .scrim{background:rgb(22 22 22 / .45)}
.sheet{position:relative;width:100%;max-width:28rem;max-height:100dvh;overflow-y:auto;border-radius:1.75rem 1.75rem 0 0;background:var(--card);padding:1.25rem;box-shadow:var(--shadow)}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:var(--radius)}}
.sheet .top{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.sheet h2{font-size:1.5rem;line-height:1.15;font-weight:800;letter-spacing:-.025em;text-wrap:balance}
.sheet .sub{margin-top:.25rem;font-size:.875rem;font-weight:600;color:var(--muted)}
.chips{margin-top:1rem;display:flex;flex-wrap:wrap;gap:.5rem}
.chips button{height:44px;padding:0 1rem;border-radius:999px;background:var(--chip);font-weight:800;box-shadow:var(--shadow)}
.chips button.on{background:var(--ink);color:var(--chip)}
.lbl{display:block;margin-top:1rem;font-size:.875rem;font-weight:700}
.amount{margin-top:.25rem;display:flex;align-items:center;gap:.5rem;height:56px;padding:0 1rem;border-radius:1rem;background:var(--chip);box-shadow:var(--shadow)}
.amount span{font-size:1.125rem;font-weight:800;color:var(--muted)}
.amount input{width:100%;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:1.25rem;font-weight:800;color:var(--ink)}
.pay{margin-top:1.25rem;display:flex;flex-direction:column;align-items:center}
.qr{width:14rem;height:14rem;padding:.5rem;border-radius:1rem;background:#fff;box-shadow:var(--shadow)}
.qr canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.val{margin-top:.75rem;font-size:1.125rem;font-weight:800}
.pay .lbl{align-self:flex-start;margin-top:1rem}
.code{margin-top:.25rem;width:100%;max-height:6rem;overflow-y:auto;border-radius:1rem;background:var(--chip);padding:.75rem;font-size:.75rem;font-weight:600;color:var(--muted);box-shadow:var(--shadow);word-break:break-all;user-select:all;-webkit-user-select:all}
.copy{margin-top:.75rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:48px;width:100%;border-radius:999px;background:var(--ink);color:var(--chip);font-size:1rem;font-weight:800}
.copy svg.i{width:20px;height:20px}
.warn{margin-top:1.25rem;border-radius:1rem;background:var(--chip);padding:1rem;font-size:.875rem;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>

		throw new Error(num.length + "/" + shift);
	}

		offset++;

		this.num[i] = num[i + offset];

		return this.num[index];

		return this.num.length;
	},

		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );

		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {

		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);

  function writeClipboard(text) {
    function fallback() {
      var a = document.createElement("textarea");
      a.value = text;
      a.setAttribute("readonly", "");
      a.style.position = "fixed";
      a.style.left = "-999px";
      document.body.appendChild(a);
      a.select();
      try { document.execCommand("copy"); } catch (e) {}
      a.remove();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    fallback();
    return Promise.resolve();
  }

  var toastTimer;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 1800);
  }

  /* ---------- lista de links ---------- */
  var openPop = null;
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

  function renderList() {
    var html = LINKS.map(function (l) {
      return '<li><div class="card" data-id="' + l.id + '">' +
        '<a class="main" href="' + esc(l.href) + '" target="_blank" rel="noreferrer">' +
        '<img class="ico" src="' + l.icon + '" alt=""><span class="t">' + esc(l.title) + '</span></a>' +
        '<button type="button" class="dots" data-dots="' + l.id + '" aria-label="Opções de ' + esc(l.title) + '" aria-expanded="false">' + svgDots + '</button>' +
        '<div class="pop" hidden>' +
        '<a href="' + esc(l.href) + '" target="_blank" rel="noreferrer">' + svgExt + 'Abrir</a>' +
        '<button type="button" data-copy="' + esc(l.href) + '">' + svgCopy + 'Copiar link</button>' +
        '</div></div></li>';
    }).join("");
    html += '<li><button type="button" class="card donate" id="btnDonate" style="width:100%">' +
      '<span class="main"><span class="ico">' + svgHeart + '</span><span class="t">Ajude no desenvolvimento do addon</span></span></button></li>';
    $("list").innerHTML = html;

      return '<a href="' + esc(l.href) + '" target="_blank" rel="noreferrer"><img src="' + l.icon + '" alt="">' + esc(l.title) + '</a>';

  function closePop() {
    if (!openPop) return;
    openPop.pop.hidden = true;
    openPop.btn.setAttribute("aria-expanded", "false");
    openPop = null;
  }

  document.addEventListener("click", function (e) {
    var dots = e.target.closest && e.target.closest("[data-dots]");
    var copyBtn = e.target.closest && e.target.closest("[data-copy]");
    if (dots) {
      var card = dots.closest(".card");
      var pop = card.querySelector(".pop");
      var wasOpen = openPop && openPop.pop === pop;
      closePop();
      if (!wasOpen) {
        pop.hidden = false;
        dots.setAttribute("aria-expanded", "true");
        openPop = { pop: pop, btn: dots };
      }
      return;
    }
    if (copyBtn) {
      writeClipboard(copyBtn.getAttribute("data-copy")).then(function () { toast("Link copiado"); });
      closePop();
      return;
    }
    if (openPop && !(e.target.closest && e.target.closest(".card"))) closePop();
  });

  /* ---------- Pix ---------- */
  function field(id, value) {
    var n = String(value.length);
    return id + (n.length < 2 ? "0" + n : n) + value;
  }
  function crc16(payload) {
    var crc = 0xffff;
    for (var i = 0; i < payload.length; i++) {
      crc ^= payload.charCodeAt(i) << 8;
      for (var b = 0; b < 8; b++) {
        crc = crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1;
        crc &= 0xffff;
      }
    }
    var h = crc.toString(16).toUpperCase();
    while (h.length < 4) h = "0" + h;
    return h;
  }
  function pixCode(amount) {
    var account = field("00", "br.gov.bcb.pix") + field("01", PIX_KEY);
    var body =
      field("00", "01") + field("01", "11") + field("26", account) +
      field("52", "0000") + field("53", "986") + field("54", amount.toFixed(2)) +
      field("58", "BR") + field("59", MERCHANT) + field("60", CITY) +
      field("62", field("05", "***")) + "6304";
    return body + crc16(body);
  }

  function parseAmount(raw) {
    var s = String(raw).replace(/[^\d.,]/g, "");
    if (!s) return NaN;
    var i = Math.max(s.lastIndexOf(","), s.lastIndexOf("."));
    var num;
    if (i < 0) {
      num = parseFloat(s);
    } else {
      var dec = s.slice(i + 1);
      var intPart = s.slice(0, i).replace(/[.,]/g, "");
      num = dec.length === 3 ? parseFloat(intPart + dec) : parseFloat(intPart + "." + dec);
    }
    return isFinite(num) ? Math.round(num * 100) / 100 : NaN;
  }
  function brl(v) { return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }

  function drawQR(text) {
    var qr = null;
    for (var type = 1; type <= 40; type++) {
      try {
        qr = new window.__QRCode(type, window.__QRErr.M);
        qr.addData(text);
        qr.make();
        break;
      } catch (e) { qr = null; }
    }
    if (!qr) return;
    var n = qr.getModuleCount(), quiet = 4, scale = 8, size = (n + quiet * 2) * scale;
    var c = $("qr");
    c.width = size; c.height = size;
    var ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#000";
    for (var r = 0; r < n; r++)
      for (var k = 0; k < n; k++)
        if (qr.isDark(r, k)) ctx.fillRect((k + quiet) * scale, (r + quiet) * scale, scale, scale);
  }

  var currentCode = "";
  function update() {
    var amount = parseAmount($("amount").value);
    var valid = amount >= MIN && amount <= MAX;
    $("pay").hidden = !valid;
    $("warn").hidden = valid;
    var chips = $("chips").children;
    for (var i = 0; i < chips.length; i++) {
      chips[i].className = valid && Number(chips[i].getAttribute("data-v")) === amount ? "on" : "";
    }
    if (!valid) {
      $("warn").textContent = "Digite um valor entre " + brl(MIN) + " e " + brl(MAX) + ".";
      currentCode = "";
      return;
    }
    currentCode = pixCode(amount);
    $("val").textContent = brl(amount);
    $("code").textContent = currentCode;
    drawQR(currentCode);
  }

  $("chips").innerHTML = SUGGESTIONS.map(function (v) {
    return '<button type="button" data-v="' + v + '">R$ ' + v + '</button>';
  }).join("");
  $("chips").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    $("amount").value = b.getAttribute("data-v");
    update();
  });
  $("amount").addEventListener("input", update);

  var copyTimer;
  $("copy").addEventListener("click", function () {
    if (!currentCode) return;
    writeClipboard(currentCode).then(function () {
      $("copyIcon").innerHTML = iconCheck;
      $("copyTxt").textContent = "Código copiado";
      clearTimeout(copyTimer);
      copyTimer = setTimeout(function () {
        $("copyIcon").innerHTML = iconCopy;
        $("copyTxt").textContent = "Copiar código Pix";
      }, 1800);
    });
  });

  function setDonate(open) {
    $("donate").hidden = !open;
    if (open) update();
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("#btnDonate")) { closePop(); setDonate(true); }
  });
  $("donateScrim").addEventListener("click", function () { setDonate(false); });
  $("donateClose").addEventListener("click", function () { setDonate(false); });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    setDrawer(false); setDonate(false); closePop();
  });

  renderList();
})();
</script>
</body>
</html>
